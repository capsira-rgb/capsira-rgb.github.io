<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Gutierrez</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="site-name back-link">Laura Gutierrez</a>
    <a href="mailto:capsira@gmail.com" class="contact-link">Contact</a>
  </header>

  <main id="corp-grid"></main>

  <footer>
    <span class="tagline">Video &nbsp;·&nbsp; Photo &nbsp;·&nbsp; Content creator</span>
    <a href="ailab.html" class="ailab-btn">AI Lab</a>
  </footer>

  <script src="corporate-projects.js"></script>
  <script>
    var grid = document.getElementById('corp-grid');
    for (var i = 0; i < corpProjects.length; i++) {
      var p = corpProjects[i];
      var item = document.createElement('a');
      item.className = 'grid-item';
      item.href = 'corporate-project.html?i=' + i;
      item.style.animationDelay = (i * 35) + 'ms';
      item.innerHTML =
        '<div class="grid-item-inner">' +
          '<img class="poster" src="lorem.png" onerror="this.onerror=null" alt="' + p.title + '" loading="lazy">' +
          '<div class="overlay">' +
            '<span class="overlay-title">' + p.title + '</span>' +
          '</div>' +
        '</div>';
      grid.appendChild(item);
    }
  </script>

</body>
</html>
