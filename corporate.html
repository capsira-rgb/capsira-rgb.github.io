  <script src="corporate-projects.js"></script>
  <script>
    var grid = document.getElementById('grid');
    for (var i = 0; i < corpProjects.length; i++) {
      var p = corpProjects[i];
      var item = document.createElement('a');
      item.className = 'grid-item';
      item.href = 'corporate-project.html?i=' + i;
      item.style.animationDelay = (i * 35) + 'ms';
      var thumb = 'https://vumbnail.com/' + p.vimeo + '.jpg';
      item.innerHTML =
        '<div class="grid-item-inner">' +
          '<img class="poster" src="' + thumb + '" onerror="this.onerror=null;this.src=\'lorem.png\'" alt="' + p.title + '" loading="lazy">' +
          '<div class="overlay">' +
            '<span class="overlay-title">' + p.title + '</span>' +
          '</div>' +
        '</div>';
      grid.appendChild(item);
    }
  </script>
