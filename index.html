<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Gutierrez</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <span class="site-name">Laura Gutierrez</span>
    <a href="mailto:capsira@gmail.com" class="contact-link">Contact</a>
  </header>

  <main id="grid"></main>

  <footer>
    <span class="tagline">Video &amp; Photo &nbsp;·&nbsp; Content creator specialist</span>
    <button class="ailab-btn" onclick="document.getElementById('ailabOverlay').classList.add('open')">
      <svg class="ailab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3H7a2 2 0 0 0-2 2v1"/>
        <path d="M15 3h2a2 2 0 0 1 2 2v1"/>
        <path d="M5 6h14"/>
        <path d="M5 6l2 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l2-13"/>
        <path d="M10 11v4"/>
        <path d="M14 11v4"/>
      </svg>
      AI Lab
    </button>
  </footer>

  <!-- AI LAB Modal -->
  <div class="ailab-overlay" id="ailabOverlay" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="ailab-modal">
      <button class="ailab-close" onclick="document.getElementById('ailabOverlay').classList.remove('open')">×</button>
      <h2>Requesting access to a restricted area<br>of AI content creation</h2>
      <input class="ailab-input" type="email" placeholder="your@email.com" id="ailabEmail">
      <button class="ailab-submit" onclick="handleAilabSubmit()">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21" />
        </svg>
      </button>
    </div>
  </div>

  <script src="projects.js"></script>
  <script>
    const grid = document.getElementById('grid');

    projects.forEach((project, i) => {
      const posterSrc = project.poster
        ? `projects/${project.folder}/${project.poster}`
        : `projects/${project.folder}/00_poster.gif`;
      const fallbackSrc = project.poster
        ? null
        : `projects/${project.folder}/00_poster.jpg`;

      const item = document.createElement('a');
      item.className = 'grid-item';
      item.href = `project.html?p=${encodeURIComponent(project.folder)}`;
      item.style.animationDelay = `${i * 35}ms`;

      const onerror = fallbackSrc
        ? `this.onerror=null;this.src='${fallbackSrc}'`
        : `this.onerror=null`;

      item.innerHTML = `
        <div class="grid-item-inner">
          <img class="poster" src="${posterSrc}" onerror="${onerror}" alt="${project.title}" loading="lazy">
          <div class="overlay">
            <span class="overlay-title">${project.title}</span>
          </div>
        </div>
      `;

      grid.appendChild(item);
    });

    function handleAilabSubmit() {
      const email = document.getElementById('ailabEmail').value;
      if (email) {
        document.getElementById('ailabOverlay').classList.remove('open');
      }
    }
  </script>

</body>
</html>
