<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Gutierrez</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <span class="site-name">Laura Gutierrez</span>
    <a href="mailto:capsira@gmail.com" class="contact-link">Contact</a>
  </header>

  <main id="grid"></main>

  <footer>
    <span class="tagline">Video &amp; Photo &nbsp;·&nbsp; Content creator specialist</span>
    <button class="ailab-btn" onclick="document.getElementById('ailabOverlay').classList.add('open')">
      <svg class="ailab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3H7a2 2 0 0 0-2 2v1"/>
        <path d="M15 3h2a2 2 0 0 1 2 2v1"/>
        <path d="M5 6h14"/>
        <path d="M5 6l2 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l2-13"/>
        <path d="M10 11v4"/>
        <path d="M14 11v4"/>
      </svg>
      AI Lab
    </button>
  </footer>

  <script src="projects.js"></script>
  <script>
    const grid = document.getElementById('grid');

    projects.forEach((project, i) => {
      const posterSrc = project.poster
        ? `projects/${project.folder}/${project.poster}`
        : `projects/${project.folder}/00_poster.gif`;

      const item = document.createElement('a');
      item.className = 'grid-item';
      item.href = `project.html?p=${encodeURIComponent(project.folder)}`;
      item.style.animationDelay = `${i * 35}ms`;

      // Fallback chain: gif → jpg → lorem.png
      const onerror = `this.onerror=null;this.src='lorem.png'`;

      item.innerHTML = `
        <div class="grid-item-inner">
          <img class="poster" src="${posterSrc}" onerror="${onerror}" alt="${project.title}" loading="lazy">
          <div class="overlay">
            <span class="overlay-title">${project.title}</span>
          </div>
        </div>
      `;

      grid.appendChild(item);
    });
    }
  </script>

</body>
</html>
