<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Gutierrez — AI Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ailab-page">

  <header>
    <a href="index.html" class="site-name back-link">Laura Gutierrez</a>
    <a href="mailto:capsira@gmail.com" class="contact-link">Contact</a>
  </header>

  <!-- PASSWORD GATE -->
  <div class="ailab-gate" id="ailabGate">
    <div class="ailab-gate-inner">

      <!-- REQUEST ACCESS form (shown first) -->
      <div id="requestSection">
        <p class="ailab-gate-label">Enter password to access</p>
        <input class="ailab-gate-input" type="password" id="passwordInput" placeholder="PASSWORD" onkeydown="if(event.key==='Enter')checkPassword()">
        <button class="ailab-gate-btn" onclick="checkPassword()">→</button>
        <p class="ailab-gate-error" id="passwordError"></p>
        <div class="ailab-divider"></div>
        <p class="ailab-gate-label" style="margin-bottom:16px">Request access</p>
        <p class="ailab-heading">Requesting access to a restricted area<br>of AI content creation</p>
        <input class="ailab-input" type="email" id="ailabEmail" placeholder="your@email.com">
        <button class="ailab-submit" id="ailabBtn" onclick="submitRequest()">
          <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </button>
        <p class="ailab-sent" id="ailabSent">SENT</p>
      </div>

    </div>
  </div>

  <!-- AI LAB CONTENT (hidden until password correct) -->
  <main class="ailab-content" id="ailabContent" style="display:none">
    <div class="ailab-grid">
      <img src="lorem.png" alt="AI Lab">
      <img src="lorem.png" alt="AI Lab">
      <img src="lorem.png" alt="AI Lab">
      <img src="lorem.png" alt="AI Lab">
      <img src="lorem.png" alt="AI Lab">
      <img src="lorem.png" alt="AI Lab">
      <img src="lorem.png" alt="AI Lab">
      <img src="lorem.png" alt="AI Lab">
      <img src="lorem.png" alt="AI Lab">
    </div>
  </main>

  <footer>
    <span class="tagline">Video &nbsp;·&nbsp; Photo &nbsp;·&nbsp; Content creator</span>
    <a href="ailab.html" class="ailab-btn">AI Lab</a>
  </footer>

  <script>
    var PASSWORD = 'WELCOME26';

    // Check if already unlocked this session
    if (sessionStorage.getItem('ailab_access') === '1') {
      showContent();
    }

    function checkPassword() {
      var val = document.getElementById('passwordInput').value.trim().toUpperCase();
      if (val === PASSWORD) {
        sessionStorage.setItem('ailab_access', '1');
        showContent();
      } else {
        document.getElementById('passwordError').textContent = 'Incorrect password.';
        document.getElementById('passwordInput').value = '';
      }
    }

    function showContent() {
      document.getElementById('ailabGate').style.display = 'none';
      document.getElementById('ailabContent').style.display = 'block';
    }

    function submitRequest() {
      var email = document.getElementById('ailabEmail').value;
      if (!email || email.indexOf('@') === -1) return;
      document.getElementById('ailabBtn').style.display = 'none';
      fetch('https://formspree.io/f/mrervvzk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          _subject: 'AI LAB ACCESS REQUEST BY ' + email,
          message: 'Alguien ha pulsado el botón de acceso al AI LAB.\n\nMail: ' + email,
          email: email
        })
      }).catch(function(){});
      document.getElementById('ailabSent').style.display = 'block';
    }
  </script>

</body>
</html>
