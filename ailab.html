<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Gutierrez — AI Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ailab-page">

  <header>
    <a href="index.html" class="site-name back-link">Laura Gutierrez</a>
    <a href="mailto:capsira@gmail.com" class="contact-link">Contact</a>
  </header>

  <main class="ailab-main">
    <div class="ailab-center" id="ailabForm">
      <h2 class="ailab-heading">Requesting access to a restricted area<br>of AI content creation</h2>
      <input class="ailab-input" type="email" id="ailabEmail" placeholder="your@email.com">
      <button class="ailab-submit" id="ailabBtn" onclick="submitAilab()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </button>
    </div>
    <div class="ailab-sent" id="ailabSent">SENT</div>
  </main>

  <footer>
    <span class="tagline">Video &amp; Photo &nbsp;·&nbsp; Content creator specialist</span>
    <a href="ailab.html" class="ailab-btn">🧪 AI Lab</a>
  </footer>

  <script>
    async function submitAilab() {
      const email = document.getElementById('ailabEmail').value;
      if (!email || !email.includes('@')) return;

      document.getElementById('ailabBtn').disabled = true;

      // Send email via Web3Forms — replace ACCESS_KEY with your key from web3forms.com
      try {
        await fetch('https://formspree.io/f/mrervvzk', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            _subject: 'AI LAB ACCESS REQUEST BY ' + email,
            message: 'Alguien ha pulsado el botón de acceso al AI LAB.\n\nMail: ' + email,
            email: email
          })
        });
      } catch(e) {}

      // Always show SENT regardless of network result
      document.getElementById('ailabForm').style.display = 'none';
      document.getElementById('ailabSent').style.display = 'block';
    }
  </script>

</body>
</html>
