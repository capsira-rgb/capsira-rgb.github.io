<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Gutierrez — AI Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="ailab-page">

  <header>
    <a href="index.html" class="site-name back-link">Laura Gutierrez</a>
    <a href="https://mail.google.com/mail/?view=cm&to=hola@lauragutierrez.co" target="_blank" class="contact-link">Contact</a>
  </header>

  <!-- PASSWORD GATE -->
  <div class="ailab-gate" id="ailabGate">
    <div class="ailab-gate-inner">
      <p class="ailab-gate-label">Enter password to access</p>
      <input class="ailab-gate-input" type="password" id="passwordInput" placeholder="PASSWORD" onkeydown="if(event.key==='Enter')checkPassword()">
      <button class="ailab-gate-btn" onclick="checkPassword()">→</button>
      <p class="ailab-gate-error" id="passwordError"></p>
      <div class="ailab-divider"></div>
      <p class="ailab-gate-label" style="margin-bottom:16px">Request access</p>
      <p class="ailab-heading">Requesting access to a restricted area<br>of AI content creation</p>
      <input class="ailab-input" type="email" id="ailabEmail" placeholder="your@email.com">
      <button class="ailab-submit" id="ailabBtn" onclick="submitRequest()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      </button>
      <p class="ailab-sent" id="ailabSent">SENT</p>
    </div>
  </div>

  <!-- AI LAB CONTENT -->
  <main class="ailab-content" id="ailabContent" style="display:none">
    <div class="ailab-grid" id="ailabGrid"></div>
  </main>

  <footer>
    <span class="tagline">Video &nbsp;·&nbsp; Photo &nbsp;·&nbsp; Content creator</span>
    <a href="ailab.html" class="ailab-btn">AI Lab</a>
  </footer>

  <script>
    var PASSWORD = 'WELCOME26';

    var videos = [
      "ailab/01_spf_3.mp4",
      "ailab/04_mimosa.mp4",
      "ailab/07_byredo_1.mp4",
      "ailab/AB_01.mp4",
      "ailab/AB_04.mp4",
      "ailab/AB4.mp4",
      "ailab/AB5.mp4",
      "ailab/Benetton_colors_01.mp4",
      "ailab/byredo_01.mp4",
      "ailab/Byredo_02.mp4",
      "ailab/ElevenLabs_video_shak.mp4",
      "ailab/hf_20260413_180842.mp4",
      "ailab/hf_20260413_181009.mp4",
      "ailab/hf_20260413_194600.mp4",
      "ailab/hf_20260414_100152.mp4",
      "ailab/hf_20260414_100818.mp4",
      "ailab/hf_20260429_141544.mp4",
      "ailab/hf_20260429_141715_e.mp4",
      "ailab/hf_20260429_142433.mp4",
      "ailab/hf_20260429_142858_.mp4",
      "ailab/hf_20260429_145140.mp4",
      "ailab/References_to_Video_-_A_young_woman_withS.mp4",
      "ailab/Sisterland_01.mp4",
      "ailab/Sisterland_02.mp4",
      "ailab/Sisterland_03.mp4",
      "ailab/Sisterland_04.mp4",
      "ailab/Sisterland_05.mp4",
      "ailab/sisterland_06.mp4",
      "ailab/Sisterland_07.mp4",
      "ailab/Sisterland_08.mp4",
      "ailab/Slow_motion_cinematic_product__Kling_25_Turbo_Pro_66125.mp4",
      "ailab/Spf_01.mp4",
      "ailab/spf_02.mp4",
      "ailab/Tribe_01.mp4",
      "ailab/Tribe_02.mp4"
    ];

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    function buildGrid(srcs) {
      var grid = document.getElementById('ailabGrid');
      srcs.forEach(function(src) {
        var v = document.createElement('video');
        v.setAttribute('autoplay', '');
        v.setAttribute('muted', '');
        v.setAttribute('loop', '');
        v.setAttribute('playsinline', '');
        v.muted = true;
        v.volume = 0;
        // Lazy: use IntersectionObserver to load src only when near viewport
        v.setAttribute('data-src', src);
        v.style.display = 'block';
        v.style.width = '100%';
        v.style.height = 'auto';
        v.style.marginBottom = 'var(--gap)';
        v.style.breakInside = 'avoid';
        grid.appendChild(v);
      });
      lazyLoad();
    }

    function lazyLoad() {
      var videos = document.querySelectorAll('video[data-src]');
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              var v = entry.target;
              var src = v.getAttribute('data-src');
              v.innerHTML = '<source src="' + src + '" type="video/mp4">';
              v.load();
              v.removeAttribute('data-src');
              observer.unobserve(v);
            }
          });
        }, { rootMargin: '400px' });
        videos.forEach(function(v) { observer.observe(v); });
      } else {
        // Fallback: load all
        videos.forEach(function(v) {
          var src = v.getAttribute('data-src');
          v.innerHTML = '<source src="' + src + '" type="video/mp4">';
          v.load();
          v.removeAttribute('data-src');
        });
      }
    }

    if (sessionStorage.getItem('ailab_access') === '1') {
      showContent();
    }

    function checkPassword() {
      var val = document.getElementById('passwordInput').value.trim().toUpperCase();
      if (val === PASSWORD) {
        sessionStorage.setItem('ailab_access', '1');
        showContent();
      } else {
        document.getElementById('passwordError').textContent = 'Incorrect password.';
        document.getElementById('passwordInput').value = '';
      }
    }

    function showContent() {
      buildGrid(shuffle(videos.slice()));
      document.getElementById('ailabGate').style.display = 'none';
      document.getElementById('ailabContent').style.display = 'block';
    }

    function submitRequest() {
      var email = document.getElementById('ailabEmail').value;
      if (!email || email.indexOf('@') === -1) return;
      document.getElementById('ailabBtn').style.display = 'none';
      fetch('https://formspree.io/f/mrervvzk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          _subject: 'AI LAB ACCESS REQUEST BY ' + email,
          message: 'Alguien ha pulsado el botón de acceso al AI LAB.\n\nMail: ' + email,
          email: email
        })
      }).catch(function(){});
      document.getElementById('ailabSent').style.display = 'block';
    }
  </script>

</body>
</html>
