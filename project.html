<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Gutierrez</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="project-page">

  <header>
    <a href="index.html" class="site-name back-link">Laura Gutierrez</a>
    <a href="mailto:capsira@gmail.com" class="contact-link">Contact</a>
  </header>

  <main id="project-content"></main>

  <footer>
    <span class="tagline">Video &nbsp;·&nbsp; Photo &nbsp;·&nbsp; Content creator</span>
    <a href="ailab.html" class="ailab-btn">AI Lab</a>
  </footer>

  <script src="projects.js"></script>
  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    var folderParam = getParam('p');
    var project = null;
    for (var i = 0; i < projects.length; i++) {
      if (projects[i].folder === folderParam) { project = projects[i]; break; }
    }

    var content = document.getElementById('project-content');

    if (!project) {
      content.innerHTML = '<p class="error">Project not found.</p>';
    } else {
      var html = '<h1 class="project-title">' + project.title + '</h1>';
      html += '<div id="videos-container"></div>';

      if (project.photos && project.photos.length > 0) {
        html += '<div class="photo-masonry">';
        for (var p = 0; p < project.photos.length; p++) {
          html += '<img src="projects/' + project.folder + '/' + project.photos[p] + '" alt="' + project.title + '" loading="lazy">';
        }
        html += '</div>';
      }

      content.innerHTML = html;

      // Load each vimeo with correct aspect ratio via oEmbed
      if (project.vimeo && project.vimeo.length > 0) {
        var container = document.getElementById('videos-container');
        project.vimeo.forEach(function(id) {
          var wrap = document.createElement('div');
          wrap.className = 'video-wrap';
          wrap.style.paddingBottom = '56.25%'; // default 16:9 while loading
          container.appendChild(wrap);

          fetch('https://vimeo.com/api/oembed.json?url=https://vimeo.com/' + id + '&width=1280')
            .then(function(r) { return r.json(); })
            .then(function(data) {
              var ratio = (data.height / data.width * 100).toFixed(4);
              wrap.style.paddingBottom = ratio + '%';
              var iframe = document.createElement('iframe');
              iframe.src = 'https://player.vimeo.com/video/' + id + '?color=ffffff&title=0&byline=0&portrait=0';
              iframe.setAttribute('frameborder', '0');
              iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
              iframe.setAttribute('allowfullscreen', '');
              wrap.appendChild(iframe);
            })
            .catch(function() {
              // fallback if oEmbed fails
              var iframe = document.createElement('iframe');
              iframe.src = 'https://player.vimeo.com/video/' + id + '?color=ffffff&title=0&byline=0&portrait=0';
              iframe.setAttribute('frameborder', '0');
              iframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
              iframe.setAttribute('allowfullscreen', '');
              wrap.appendChild(iframe);
            });
        });
      }
    }
  </script>

</body>
</html>
