<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laura Gutierrez</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .vimeo-wrap { position: relative; width: 100%; margin-bottom: 48px; }
    .vimeo-wrap iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="project-page">
  <header>
    <a href="index.html" class="site-name back-link">Laura Gutierrez</a>
    <a href="https://mail.google.com/mail/?view=cm&to=hola@lauragutierrez.co" target="_blank" class="contact-link">Contact</a>
  </header>
  <main id="project-content"></main>
  <footer>
    <span class="tagline">Video &nbsp;·&nbsp; Photo &nbsp;·&nbsp; Content creator</span>
    <a href="ailab.html" class="ailab-btn">AI Lab</a>
  </footer>
  <script src="projects.js"></script>
  <script>
    (function() {
      function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }
      var folderParam = getParam('p');
      var project = null;
      for (var i = 0; i < projects.length; i++) {
        if (projects[i].folder === folderParam) { project = projects[i]; break; }
      }
      var content = document.getElementById('project-content');
      if (!project) { content.innerHTML = '<p class="error">Project not found.</p>'; return; }

      var html = '<h1 class="project-title">' + project.title + '</h1>';

      if (project.vimeo && project.vimeo.length > 0) {
        for (var v = 0; v < project.vimeo.length; v++) {
          var id = project.vimeo[v];
          var ratioStr = (project.ratio && project.ratio[v]) ? project.ratio[v] : '16/9';
          var parts = ratioStr.split('/');
          var pct = (parseFloat(parts[1]) / parseFloat(parts[0]) * 100).toFixed(4) + '%';
          var isVertical = parseFloat(parts[0]) < parseFloat(parts[1]);
          var outerStyle = isVertical ? 'max-width:440px;margin-left:auto;margin-right:auto;' : '';
          html += '<div style="' + outerStyle + '">'
            + '<div class="vimeo-wrap" style="padding-bottom:' + pct + '">'
            + '<iframe src="https://player.vimeo.com/video/' + id
            + '?color=ffffff&title=0&byline=0&portrait=0" '
            + 'frameborder="0" allow="autoplay;fullscreen;picture-in-picture" allowfullscreen></iframe>'
            + '</div></div>';
        }
      }

      if (project.photos && project.photos.length > 0) {
        html += '<div class="photo-masonry">';
        for (var p = 0; p < project.photos.length; p++) {
          html += '<img src="projects/' + project.folder + '/' + project.photos[p] + '" alt="' + project.title + '" loading="lazy">';
        }
        html += '</div>';
      }

      content.innerHTML = html;
    })();
  </script>
</body>
</html>
